[project]
name = "d8r"
version = "0.1.0"
description = "A keyboard-first IDE for querying data through Ibis, in the terminal"
requires-python = ">=3.13"
dependencies = [
    "ibis-framework[duckdb]==12.0.0",
    "pyarrow==24.0.0",
    "pyarrow-hotfix==0.7",
    "httpx==0.28.1",
    "textual==8.2.7",
]

[project.scripts]
d8r = "d8r.tui.app:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["d8r"]

[tool.pytest.ini_options]
testpaths = ["tests"]
