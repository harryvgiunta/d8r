name: d8r
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: d8r
      POSTGRES_DB: d8r
      POSTGRES_PASSWORD: ${D8R_POSTGRES_PASSWORD:?Set D8R_POSTGRES_PASSWORD in .env.postgres}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d8r -d d8r"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
